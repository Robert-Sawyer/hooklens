services:
  db:
    image: pgvector/pgvector:pg16
    container_name: hooklens-db
    environment:
      POSTGRES_USER: hooklens
      POSTGRES_PASSWORD: hooklens
      POSTGRES_DB: hooklens
    ports:
      - "5433:5432"
    volumes:
      - hooklens_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooklens -d hooklens"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hooklens_postgres:
