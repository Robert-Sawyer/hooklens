name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma generate reads DATABASE_URL but does not connect to PostgreSQL.
      - run: cp .env.example .env
      - run: pnpm db:generate
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
